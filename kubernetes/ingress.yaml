apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ecommerce-ingress
spec:
  rules:
    - http:
        paths:
          # Route all API calls to the backend Express server
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: server
                port:
                  number: 3000

          # Route all other web traffic to the frontend React/Nginx client
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 80
