apiVersion: v1
kind: ServiceAccount
metadata:
  name: server-sa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: server-role
rules:
  - apiGroups: ['']
    resources: ['configmaps']
    verbs: ['get', 'list', 'watch']
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: server-rolebinding
subjects:
  - kind: ServiceAccount
    name: server-sa
roleRef:
  kind: Role
  name: server-role
  apiGroup: rbac.authorization.k8s.io
