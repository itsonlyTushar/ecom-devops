apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: production

resources:
  - namespace.yaml
  - ../../base

labels:
  - includeSelectors: false
    pairs:
      environment: production

patches:
  - path: replicas-patch.yaml

images:
  - name: devopscommerce.azurecr.io/server
    newTag: latest
  - name: devopscommerce.azurecr.io/client
    newTag: latest
