name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '18'

jobs:
  server:
    name: Server - Install, Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run tests
        working-directory: server
        run: npm test

  client:
    name: Client - Install, Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  acr-push:
    name: Docker - Build & Push to ACR
    runs-on: ubuntu-latest
    needs: [server, client]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/server:latest

      - name: Build and Push Client Image
        uses: docker/build-push-action@v5
        with:
          context: client
          file: client/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/client:latest

      - name: Scan Server Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Scan Client Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Kubernetes - Deploy to AKS (Staging)
    runs-on: ubuntu-latest
    needs: [acr-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create Namespace
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or Update Secrets
        run: |
          kubectl create secret generic server-secrets \
            --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --namespace staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Kustomize (Git SHA Tagging)
        run: |
          cd kubernetes/overlays/staging
          kustomize edit set image devopscommerce.azurecr.io/server=${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
          kustomize edit set image devopscommerce.azurecr.io/client=${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}
          kubectl apply -k .

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/server --namespace staging --timeout=180s
          kubectl rollout status deployment/client --namespace staging --timeout=180s

  deploy-production:
    name: Kubernetes - Deploy to AKS (Production)
    runs-on: ubuntu-latest
    needs: [acr-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v4

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set up Kubernetes Context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create Namespace
        run: kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or Update Secrets
        run: |
          kubectl create secret generic server-secrets \
            --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --namespace production \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy with Kustomize (Git SHA Tagging)
        run: |
          cd kubernetes/overlays/production
          kustomize edit set image devopscommerce.azurecr.io/server=${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
          kustomize edit set image devopscommerce.azurecr.io/client=${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}
          kubectl apply -k .

      - name: Verify Rollout Status
        run: |
          kubectl rollout status deployment/server --namespace production --timeout=180s
          kubectl rollout status deployment/client --namespace production --timeout=180s
