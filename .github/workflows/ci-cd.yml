name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '18'

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install
        working-directory: server
        run: npm ci

      - name: Test
        working-directory: server
        run: npm test

  client:
    name: Client
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install
        working-directory: client
        run: npm ci

      - name: Build
        working-directory: client
        run: npm run build

  acr-push:
    name: Docker
    runs-on: ubuntu-latest
    needs: [server, client]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_NAME }}.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build server
        uses: docker/build-push-action@v5
        with:
          context: server
          file: server/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/server:latest

      - name: Build client
        uses: docker/build-push-action@v5
        with:
          context: client
          file: client/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}
            ${{ secrets.ACR_NAME }}.azurecr.io/client:latest

      - name: Trivy server
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Trivy client
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  deploy-staging:
    name: Staging
    runs-on: ubuntu-latest
    needs: [acr-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    environment:
      name: staging
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace
        run: kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secret
        run: |
          kubectl create secret generic appinsights-secrets \
            --from-literal=APPLICATIONINSIGHTS_CONNECTION_STRING='${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}' \
            --namespace staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute secrets
        env:
          KEY_VAULT_NAME: ${{ secrets.KEY_VAULT_NAME }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AKS_SECRETS_PROVIDER_CLIENT_ID: ${{ secrets.AKS_SECRETS_PROVIDER_CLIENT_ID }}
        run: |
          envsubst < kubernetes/base/secret-provider.yaml > /tmp/secret-provider.yaml
          mv /tmp/secret-provider.yaml kubernetes/base/secret-provider.yaml

      - name: Deploy
        run: |
          cd kubernetes/overlays/staging
          kustomize edit set image devopscommerce.azurecr.io/server=${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
          kustomize edit set image devopscommerce.azurecr.io/client=${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}
          kubectl apply -k .

      - name: Rollout
        run: |
          kubectl rollout status deployment/server --namespace staging --timeout=180s
          kubectl rollout status deployment/client --namespace staging --timeout=180s

  deploy-production:
    name: Production
    runs-on: ubuntu-latest
    needs: [acr-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    environment:
      name: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Set context
        uses: azure/k8s-set-context@v4
        with:
          method: kubeconfig
          kubeconfig: ${{ secrets.KUBE_CONFIG }}

      - name: Create namespace
        run: kubectl create namespace production --dry-run=client -o yaml | kubectl apply -f -

      - name: Create secret
        run: |
          kubectl create secret generic appinsights-secrets \
            --from-literal=APPLICATIONINSIGHTS_CONNECTION_STRING='${{ secrets.APP_INSIGHTS_CONNECTION_STRING }}' \
            --namespace production \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Substitute secrets
        env:
          KEY_VAULT_NAME: ${{ secrets.KEY_VAULT_NAME }}
          TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AKS_SECRETS_PROVIDER_CLIENT_ID: ${{ secrets.AKS_SECRETS_PROVIDER_CLIENT_ID }}
        run: |
          envsubst < kubernetes/base/secret-provider.yaml > /tmp/secret-provider.yaml
          mv /tmp/secret-provider.yaml kubernetes/base/secret-provider.yaml

      - name: Deploy
        run: |
          cd kubernetes/overlays/production
          kustomize edit set image devopscommerce.azurecr.io/server=${{ secrets.ACR_NAME }}.azurecr.io/server:${{ github.sha }}
          kustomize edit set image devopscommerce.azurecr.io/client=${{ secrets.ACR_NAME }}.azurecr.io/client:${{ github.sha }}
          kubectl apply -k .

      - name: Rollout
        run: |
          kubectl rollout status deployment/server --namespace production --timeout=180s
          kubectl rollout status deployment/client --namespace production --timeout=180s
